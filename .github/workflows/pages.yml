name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Check game behavior
        run: |
          node tools/test-world.js
          node tools/test-serverless.mjs
          node tools/test-cloud-client.js
          node tools/test-world-fields.js
          node tools/test-telemetry.js
          node tools/test-ad-callbacks.js
          node tools/test-journey-events.js
          node tools/test-animals-generation.js
          node tools/test-mushroom-harvest.js
          node tools/test-ladybug-movement.js
          node tools/test-hero-abilities.js
          node tools/test-house-discovery.js
          node tools/test-item-ground-shadow.js
          node tools/test-forest-presentation.js
          node tools/test-snail-sparks.js
          node tools/test-sapphire-reward.js
          node tools/test-tint-interpolation.js
      - run: npm run pages:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4

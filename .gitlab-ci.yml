stages:
  - build
  - dockerize
build:
  image: node:latest
  stage: build
  script:
    - npm install
    - npm run deploy
    - mkdir distrib
    - cp -r build/* distrib/
    - cp -r assets distrib/
    - cp style.css distrib/
  artifacts:
    name: "${CI_BUILD_REF_NAME}_${CI_BUILD_REF}"
    expire_in: 1 hr
    paths:
      - distrib
dockerize:
  image: docker 
  stage: dockerize
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_BUILD_TOKEN $CI_REGISTRY
  script:
    - if [ "$CI_COMMIT_REF_NAME" == "master" ]; then DTAG=''; else DTAG=':'$CI_COMMIT_REF_NAME; fi;
    - echo $DTAG
    - docker build -t $CI_REGISTRY_IMAGE$DTAG .
    - docker push $CI_REGISTRY_IMAGE
  after_script:
    - docker logout $CI_REGISTRY
  